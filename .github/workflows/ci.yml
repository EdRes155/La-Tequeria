name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: tequeria-app

jobs:
  app:
    name: Pruebas unitarias, build y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tequeria-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets

  sql:
    name: Esquema SQL contra PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tequeria-app/package-lock.json
      - run: npm ci
      - run: npm run test:sql

  e2e:
    name: Recorridos en navegador (modo local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tequeria-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: tequeria-app/test-results
          retention-days: 7
